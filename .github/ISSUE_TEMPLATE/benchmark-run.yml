name: Benchmark run submission
description: Submit a reproducible run with task-bound outputs and evaluation evidence.
title: "[QCB run] "
labels: []
body:
  - type: input
    id: dataset
    attributes:
      label: Registry version/hash and source commit
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model, harness and environment
      description: State model/checkpoint, exposure mode, thinking configuration, runtime and resource budget.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Reproduction command and artifacts
      description: Link the run manifest, task-bound responses, score report and any bound expert reviews.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results by dimension and unresolved outcomes
      description: Separate decision, explanation, formal and resource results; retain missing, abstained and blocked counts.
    validations:
      required: true
