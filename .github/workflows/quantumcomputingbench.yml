name: QuantumComputingBench contracts
on:
  push:
    branches: [main, loty]
    paths:
      - 'benchmarks/quantumcomputingbench/**'
      - '.github/workflows/quantumcomputingbench.yml'
  pull_request:
    paths:
      - 'benchmarks/quantumcomputingbench/**'
      - 'QuantumBlockEncoding/**'
      - 'website/research/**'
      - 'web/library/declarations.json'
      - '.github/workflows/quantumcomputingbench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r benchmarks/quantumcomputingbench/requirements.txt
      - run: python -m unittest discover -s benchmarks/quantumcomputingbench/tests -v
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python benchmarks/quantumcomputingbench/scripts/qcb.py validate --version release-v3
        env:
          PYTHONUTF8: '1'
      - run: python benchmarks/quantumcomputingbench/scripts/release.py validate
        env:
          PYTHONUTF8: '1'
      - run: python benchmarks/quantumcomputingbench/scripts/curriculum.py validate
        env:
          PYTHONUTF8: '1'
      - name: Validate registered agentic task evidence
        run: python benchmarks/quantumcomputingbench/scripts/evaluate_agentic.py validate
        env:
          PYTHONUTF8: '1'
      - name: Prepare an offline operator profile template
        run: python benchmarks/quantumcomputingbench/scripts/evaluate_agentic.py profile-template --output "${{ runner.temp }}/qcb-operator-profile.json"
        env:
          PYTHONUTF8: '1'
      - name: Exercise the synthetic agentic protocol without Lean or models
        run: python benchmarks/quantumcomputingbench/scripts/evaluate_agentic.py run-fixture --view qcb-agentic-sp-007-v1 --mode proof_dag --episode-dir "${{ runner.temp }}/qcb-agentic-fixture"
        env:
          PYTHONUTF8: '1'
      - name: Validate the staged Lean course and recorded reference evidence
        run: python benchmarks/quantumcomputingbench/scripts/lean_course.py audit
        env:
          PYTHONUTF8: '1'
      - name: Exercise the course protocol with a synthetic verifier
        run: python benchmarks/quantumcomputingbench/scripts/lean_course.py run-fixture --view qcb-course-be-105-v1 --episode-dir "${{ runner.temp }}/qcb-course-fixture"
        env:
          PYTHONUTF8: '1'
      - name: Validate the successor course and its frozen cohort evidence
        run: python benchmarks/quantumcomputingbench/scripts/lean_course_v2.py audit
        env:
          PYTHONUTF8: '1'
      - name: Exercise the successor course without Lean or model execution
        run: python benchmarks/quantumcomputingbench/scripts/lean_course_v2.py run-fixture --view qcb-course-sp-113-v1 --episode-dir "${{ runner.temp }}/qcb-course-v2-fixture"
        env:
          PYTHONUTF8: '1'
      - name: Validate the third cohort and sanitized historical alignment
        run: python benchmarks/quantumcomputingbench/scripts/lean_course_v3.py audit
        env:
          PYTHONUTF8: '1'
      - name: Exercise shared-provider endpoint branches with a synthetic verifier
        run: python benchmarks/quantumcomputingbench/scripts/lean_course_v3.py run-fixture --view qcb-course-sp-104-v1 --episode-dir "${{ runner.temp }}/qcb-course-v3-fixture"
        env:
          PYTHONUTF8: '1'
      - name: Validate semantic question, review and authored-reference evidence
        run: python benchmarks/quantumcomputingbench/scripts/learning_validity.py audit
        env:
          PYTHONUTF8: '1'
      - name: Export answer-free semantic prompts and exercise decision controls
        run: |
          python benchmarks/quantumcomputingbench/scripts/learning_validity.py export-stage-a --seed 23 --output "${{ runner.temp }}/qcb-semantic-stage-a.json"
          python benchmarks/quantumcomputingbench/scripts/learning_validity.py run-fixture --output "${{ runner.temp }}/qcb-semantic-fixture.json"
        env:
          PYTHONUTF8: '1'
      - name: Check sealed assessment metadata and source-bound qualification
        run: python benchmarks/quantumcomputingbench/scripts/assessment_v3.py audit
        env:
          PYTHONUTF8: '1'
      - name: Validate Lean QA v5, sparse study seal, and paired train projection
        run: |
          python benchmarks/quantumcomputingbench/scripts/lean_course_v5.py audit
          python benchmarks/quantumcomputingbench/scripts/sparse_assessment.py audit
          python benchmarks/quantumcomputingbench/scripts/lean_qa_training.py --output "${{ runner.temp }}/qcb-sparse-training.json"
        env:
          PYTHONUTF8: '1'
      - name: Validate the executable registry and run CPU reference controls
        run: |
          python benchmarks/quantumcomputingbench/scripts/bench.py validate
          python benchmarks/quantumcomputingbench/scripts/bench.py smoke --output "${{ runner.temp }}/qcb-runtime-smoke"
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest website.scripts.test_quantumcomputingbench website.scripts.test_qcb_diagnostics website.scripts.test_qcb_math website.scripts.test_qcb_expert website.scripts.test_qcb_publication_contract website.scripts.test_qcb_hierarchy website.scripts.test_qcb_nonlean_workbook website.scripts.test_qcb_lean_qa_reader -v
        env:
          PYTHONUTF8: '1'
      # This job validates checked artifacts and software contracts. It does NOT
      # claim to rerun Lean or to provision a container verifier image.
